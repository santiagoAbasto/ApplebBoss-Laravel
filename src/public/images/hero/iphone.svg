<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#011446"/>
    </linearGradient>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E8EA0"/>
      <stop offset="40%" stop-color="#C8C8D0"/>
      <stop offset="100%" stop-color="#6A6A7A"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1e"/>
      <stop offset="50%" stop-color="#1a1040"/>
      <stop offset="100%" stop-color="#0d0d2a"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#585E9F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A3BD31" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow-bg" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#585E9F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#011446" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-10%" width="160%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="glow-filter">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="360" height="480" fill="url(#bg)"/>
  <ellipse cx="180" cy="180" rx="160" ry="140" fill="url(#glow-bg)"/>

  <!-- Phone body shadow -->
  <rect x="98" y="65" width="164" height="354" rx="36" fill="#000" opacity="0.5" filter="url(#shadow)"/>

  <!-- Phone body -->
  <rect x="95" y="60" width="170" height="360" rx="36" fill="url(#body)"/>

  <!-- Side rail highlight -->
  <rect x="95" y="60" width="5" height="360" rx="2" fill="#D8D8E0" opacity="0.6"/>
  <rect x="260" y="60" width="5" height="360" rx="2" fill="#909098" opacity="0.4"/>

  <!-- Screen bezel -->
  <rect x="103" y="68" width="154" height="344" rx="30" fill="#0a0a1e"/>

  <!-- Screen content -->
  <rect x="105" y="70" width="150" height="340" rx="29" fill="url(#screen)"/>

  <!-- Screen glow accent -->
  <rect x="105" y="70" width="150" height="340" rx="29" fill="url(#glow1)" opacity="0.15"/>

  <!-- Abstract screen UI -->
  <g opacity="0.8">
    <!-- Time -->
    <text x="180" y="130" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="300" font-size="38" fill="white" opacity="0.9">9:41</text>
    <text x="180" y="152" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="white" opacity="0.5">Jue 27 de agosto</text>

    <!-- Notification cards -->
    <rect x="120" y="168" width="120" height="40" rx="12" fill="white" opacity="0.08"/>
    <rect x="125" y="176" width="20" height="20" rx="6" fill="#585E9F" opacity="0.8"/>
    <rect x="150" y="178" width="60" height="6" rx="3" fill="white" opacity="0.4"/>
    <rect x="150" y="188" width="40" height="4" rx="2" fill="white" opacity="0.2"/>

    <rect x="120" y="214" width="120" height="40" rx="12" fill="white" opacity="0.06"/>
    <rect x="125" y="222" width="20" height="20" rx="6" fill="#A3BD31" opacity="0.7"/>
    <rect x="150" y="224" width="50" height="6" rx="3" fill="white" opacity="0.35"/>
    <rect x="150" y="234" width="35" height="4" rx="2" fill="white" opacity="0.18"/>

    <!-- App icons grid -->
    <g opacity="0.7">
      <rect x="120" y="270" width="28" height="28" rx="7" fill="#585E9F"/>
      <rect x="154" y="270" width="28" height="28" rx="7" fill="#A3BD31"/>
      <rect x="188" y="270" width="28" height="28" rx="7" fill="#C6CB36" opacity="0.8"/>
      <rect x="222" y="270" width="28" height="28" rx="7" fill="#28224F"/>

      <rect x="120" y="304" width="28" height="28" rx="7" fill="#011446"/>
      <rect x="154" y="304" width="28" height="28" rx="7" fill="#585E9F" opacity="0.6"/>
      <rect x="188" y="304" width="28" height="28" rx="7" fill="#A3BD31" opacity="0.7"/>
      <rect x="222" y="304" width="28" height="28" rx="7" fill="#1a1040"/>
    </g>

    <!-- Dock -->
    <rect x="115" y="345" width="130" height="44" rx="18" fill="white" opacity="0.1"/>
    <rect x="125" y="352" width="28" height="28" rx="8" fill="#585E9F" opacity="0.9"/>
    <rect x="159" y="352" width="28" height="28" rx="8" fill="#011446" opacity="0.9"/>
    <rect x="193" y="352" width="28" height="28" rx="8" fill="#A3BD31" opacity="0.9"/>
    <rect x="207" y="352" width="14" height="28" rx="6" fill="#C6CB36" opacity="0.7"/>
  </g>

  <!-- Dynamic Island -->
  <rect x="153" y="79" width="54" height="18" rx="9" fill="#000"/>
  <!-- Dynamic Island camera dot -->
  <circle cx="196" cy="88" r="4" fill="#1a1a2e"/>

  <!-- Screen reflection -->
  <rect x="105" y="70" width="150" height="160" rx="29" fill="url(#reflect)"/>

  <!-- Lime glow accent bottom -->
  <ellipse cx="180" cy="430" rx="80" ry="16" fill="#A3BD31" opacity="0.12"/>
</svg>
