<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" width="360" height="480">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120c2e"/>
      <stop offset="100%" stop-color="#0a0a1e"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#C6CB36" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#120c2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="case-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3BD31"/>
      <stop offset="50%" stop-color="#8aaa20"/>
      <stop offset="100%" stop-color="#6a8a10"/>
    </linearGradient>
    <linearGradient id="case-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="phone-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a20"/>
      <stop offset="100%" stop-color="#181830"/>
    </linearGradient>
    <filter id="myskin-shadow">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <filter id="case-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#A3BD31" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="360" height="480" fill="url(#bg4)"/>
  <ellipse cx="180" cy="190" rx="160" ry="140" fill="url(#glow4)"/>

  <!-- Phone + case shadow -->
  <rect x="102" y="62" width="156" height="356" rx="38" fill="#000" opacity="0.5" filter="url(#myskin-shadow)"/>

  <!-- MYSKIN case body — lime green -->
  <rect x="98" y="58" width="164" height="364" rx="38" fill="url(#case-grad)" filter="url(#case-glow)"/>

  <!-- Case texture pattern (subtle diagonal lines) -->
  <g opacity="0.06">
    <line x1="98" y1="100" x2="262" y2="58" stroke="white" stroke-width="2"/>
    <line x1="98" y1="130" x2="262" y2="88" stroke="white" stroke-width="2"/>
    <line x1="98" y1="160" x2="262" y2="118" stroke="white" stroke-width="2"/>
    <line x1="98" y1="190" x2="262" y2="148" stroke="white" stroke-width="2"/>
    <line x1="98" y1="220" x2="262" y2="178" stroke="white" stroke-width="2"/>
    <line x1="98" y1="250" x2="262" y2="208" stroke="white" stroke-width="2"/>
    <line x1="98" y1="280" x2="262" y2="238" stroke="white" stroke-width="2"/>
    <line x1="98" y1="310" x2="262" y2="268" stroke="white" stroke-width="2"/>
    <line x1="98" y1="340" x2="262" y2="298" stroke="white" stroke-width="2"/>
    <line x1="98" y1="370" x2="262" y2="328" stroke="white" stroke-width="2"/>
    <line x1="98" y1="400" x2="262" y2="358" stroke="white" stroke-width="2"/>
    <line x1="98" y1="422" x2="230" y2="388" stroke="white" stroke-width="2"/>
    <line x1="130" y1="422" x2="262" y2="390" stroke="white" stroke-width="2"/>
  </g>

  <!-- Case sheen -->
  <rect x="98" y="58" width="164" height="364" rx="38" fill="url(#case-sheen)"/>

  <!-- Side highlight -->
  <rect x="98" y="58" width="6" height="364" rx="3" fill="white" opacity="0.2"/>

  <!-- Camera bump cutout -->
  <rect x="218" y="70" width="36" height="36" rx="10" fill="#7a9a15" opacity="0.8"/>
  <circle cx="236" cy="88" r="11" fill="#5a7a10"/>
  <circle cx="236" cy="88" r="7" fill="#3a5a08" opacity="0.9"/>
  <circle cx="236" cy="88" r="4" fill="#1a2a04" opacity="0.9"/>
  <circle cx="233" cy="85" r="1.5" fill="white" opacity="0.3"/>
  <!-- Flash -->
  <circle cx="220" cy="80" r="3" fill="#ffcc00" opacity="0.7"/>

  <!-- Phone screen (inside case) -->
  <rect x="112" y="76" width="136" height="326" rx="26" fill="#080810"/>
  <rect x="114" y="78" width="132" height="322" rx="25" fill="url(#phone-screen)"/>

  <!-- Dynamic Island -->
  <rect x="154" y="86" width="52" height="18" rx="9" fill="#000"/>

  <!-- Screen content — MYSKIN brand -->
  <rect x="114" y="78" width="132" height="322" rx="25" fill="rgba(163,189,49,0.05)"/>

  <!-- MYSKIN logo on screen -->
  <text x="180" y="200" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="900" font-size="22" fill="#A3BD31" opacity="0.85" letter-spacing="3">MYSKIN</text>
  <text x="180" y="222" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="400" font-size="10" fill="white" opacity="0.4" letter-spacing="2">PROTECCIÓN CON ESTILO</text>

  <!-- Abstract UI circles -->
  <circle cx="180" cy="285" r="36" fill="none" stroke="#A3BD31" stroke-width="1" opacity="0.2"/>
  <circle cx="180" cy="285" r="24" fill="none" stroke="#A3BD31" stroke-width="1" opacity="0.3"/>
  <circle cx="180" cy="285" r="12" fill="#A3BD31" opacity="0.15"/>

  <!-- Time -->
  <text x="180" y="140" text-anchor="middle" font-family="system-ui,sans-serif" font-weight="300" font-size="34" fill="white" opacity="0.8">9:41</text>

  <!-- Bottom nav dots -->
  <circle cx="164" cy="374" r="4" fill="white" opacity="0.5"/>
  <circle cx="180" cy="374" r="6" fill="white" opacity="0.9"/>
  <circle cx="196" cy="374" r="4" fill="white" opacity="0.5"/>

  <!-- MYSKIN label on case exterior -->
  <text x="112" y="434" font-family="system-ui,sans-serif" font-weight="800" font-size="9" fill="white" opacity="0.25" letter-spacing="2">MYSKIN</text>

  <!-- Bottom glow -->
  <ellipse cx="180" cy="445" rx="90" ry="16" fill="#A3BD31" opacity="0.15"/>
  <ellipse cx="180" cy="460" rx="70" ry="10" fill="#C6CB36" opacity="0.08"/>
</svg>
