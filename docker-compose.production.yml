name: appleboss-production

x-app: &app
  image: appleboss-app:production
  build:
    context: .
    dockerfile: Dockerfile.production
  env_file:
    - .env.production
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - appleboss_storage:/var/www/html/storage
  networks:
    - backend

services:
  app:
    <<: *app
    expose:
      - "80"
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]
    stop_grace_period: 2m

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - appleboss_postgres:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

  # n8n: motor de automatización (reporte IA con Claude + respaldo de base).
  # Solo localhost (127.0.0.1): se administra por túnel SSH, nunca expuesto a internet.
  # Los workflows usan http://app y la red backend; no toca app/queue/db/caddy.
  n8n:
    build:
      context: .
      dockerfile: docker/n8n/Dockerfile
    image: appleboss-n8n:production
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - TZ=America/La_Paz
      - GENERIC_TIMEZONE=America/La_Paz
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_SECURE_COOKIE=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODES_EXCLUDE=["n8n-nodes-base.localFileTrigger"]
      - PGHOST=db
      - PGPORT=5432
      - PGDATABASE=${POSTGRES_DB}
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - appleboss_n8n_data:/home/node/.n8n
      - appleboss_n8n_backups:/backups/database
      - ./n8n/workflows:/workflows:ro
    networks:
      - backend

networks:
  edge:
  backend:

volumes:
  appleboss_postgres:
  appleboss_storage:
  caddy_data:
  caddy_config:
  appleboss_n8n_data:
  appleboss_n8n_backups:
