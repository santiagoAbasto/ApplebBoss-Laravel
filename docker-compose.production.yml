name: appleboss-production

x-app: &app
  image: appleboss-app:production
  build:
    context: .
    dockerfile: Dockerfile.production
  env_file:
    - .env.production
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - appleboss_storage:/var/www/html/storage
  networks:
    - backend

services:
  app:
    <<: *app
    expose:
      - "80"
    networks:
      - edge
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120", "--max-time=3600"]
    stop_grace_period: 2m

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  db:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - appleboss_postgres:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

networks:
  edge:
  backend:

volumes:
  appleboss_postgres:
  appleboss_storage:
  caddy_data:
  caddy_config:
